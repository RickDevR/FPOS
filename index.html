<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewel POS - Release Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen p-6 md:p-12">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-3xl font-bold text-amber-400">Release Management Dashboard</h1>
        <p class="text-sm text-slate-400 mt-1">Deploy new app updates or roll back active versions in real-time</p>
      </div>
      <div id="activeVersionBadge" class="p-4 bg-slate-900 border border-amber-500/30 rounded-2xl flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <div>
          <div class="text-[10px] uppercase font-bold text-slate-400">Current Active Target</div>
          <div id="activeVersionText" class="text-lg font-bold text-amber-400">v0.0.0</div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- PUBLISH NEW VERSION FORM -->
      <div class="lg:col-span-1 card p-6 bg-slate-900/80 border border-slate-800 rounded-3xl space-y-4 shadow-xl">
        <h2 class="text-lg font-bold text-amber-400">Publish New Version</h2>
        
        <form id="uploadForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Version Number *</label>
            <input id="inputVersion" type="text" placeholder="e.g. 1.0.1" required class="input-field w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm focus:border-amber-400 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Release Notes</label>
            <textarea id="inputNotes" placeholder="Describe changes..." class="input-field w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm focus:border-amber-400 outline-none h-24"></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Installer / Build Binary *</label>
            <input id="inputFile" type="file" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-400 file:text-slate-950 hover:file:bg-amber-300 cursor-pointer">
          </div>

          <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" id="checkSetActive" class="rounded text-amber-400 focus:ring-0" checked>
            <label for="checkSetActive" class="text-xs text-slate-300">Set as active release immediately</label>
          </div>

          <button type="submit" id="btnUpload" class="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm rounded-xl transition duration-200">
            Upload & Deploy
          </button>
        </form>

        <div id="progressContainer" class="hidden space-y-1 pt-2">
          <div class="flex justify-between text-xs font-semibold text-amber-400">
            <span>Uploading build...</span>
            <span id="progressText">0%</span>
          </div>
          <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
            <div id="progressBar" class="bg-amber-400 h-full w-0 transition-all duration-200"></div>
          </div>
        </div>
      </div>

      <!-- VERSIONS HISTORY & ROLLBACK TABLE -->
      <div class="lg:col-span-2 card p-6 bg-slate-900/80 border border-slate-800 rounded-3xl space-y-4 shadow-xl">
        <h2 class="text-lg font-bold text-amber-400">All Published Versions</h2>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-950 text-amber-400 uppercase tracking-wider text-[10px] font-bold">
              <tr>
                <th class="p-3">Version</th>
                <th class="p-3">Status</th>
                <th class="p-3">Release Notes</th>
                <th class="p-3">File Name</th>
                <th class="p-3">Action</th>
              </tr>
            </thead>
            <tbody id="versionsTableBody" class="divide-y divide-slate-800">
              <tr>
                <td colspan="5" class="p-4 text-center text-slate-500">Loading versions from database...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
